function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3000)}function line(n,v){return '<div class="line"><span style="white-space:nowrap">'+n+'：</span><span>'+esc(v||'—')+'</span></div>'}function btn(t,fn,cls=''){const b=document.createElement('button');b.textContent=t;b.className=cls;b.onclick=fn;return b}
function dock(id){const node=$(id);if(!node)return;const bar=$('actionBar');bar.style.display='';bar.style.gap='';bar.replaceChildren(node);bar.hidden=false}function screen(title,back=null,nav=false){$('actionBar').style.display='';$('actionBar').style.gap='';$('actionBar').replaceChildren();$('actionBar').hidden=true;$('title').textContent=title;$('main').replaceChildren();$('main').scrollTop=0;$('back').hidden=!back;$('back').innerHTML=icon('back');$('back').onclick=back;$('bottom').hidden=!nav;if(nav){$('bottom').innerHTML=[['todo','待办'],['work','工作台'],['mine','我的']].map(([k,n])=>'<button data-nav="'+k+'" class="'+(route===k?'active':'')+'">'+icon(k==='work'?'home':k==='mine'?'user':'todo')+'<span>'+n+'</span></button>').join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav))}}
function go(to){route=to;if(to==='work')work();else if(to==='mine')mine();else todo()}
function work(){screen('工作台',null,true);const apps=[['设备台账','ledger',false],['设备报修','report',true],['设备维修','repair',true],['设备保养','oil',false]];$('main').innerHTML='<h2 class="apps-title">我的应用</h2><div class="applications">'+apps.map(([n,k,enabled])=>'<button '+(enabled?'data-app="'+n+'"':'disabled aria-disabled="true"')+'><span class="tile">'+icon(k)+'</span><span>'+n+'</span></button>').join('')+'</div>';document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{if(b.dataset.app==='设备报修'){keyword='';tab='pending';reportList()}else if(b.dataset.app==='设备维修'){repairTab='pending';repairKeyword='';repairList()}else{screen(b.dataset.app,()=>go('work'));$('main').innerHTML='<div class="empty">暂无数据</div>'}})}

function sheet(html){$('overlay').hidden=false;$('overlay').innerHTML='<section class="sheet" role="dialog" aria-modal="true">'+html+'</section>'}function closeSheet(){$('overlay').hidden=true;$('overlay').replaceChildren()}
function setting(n){if(n==='切换水厂'){sheet('<h2>切换水厂</h2><select id="factory"><option>德清水厂</option></select><div class="actions"><button id="cancel">取消</button><button class="primary" id="ok">确定</button></div>');$('cancel').onclick=closeSheet;$('ok').onclick=()=>{factory=$('factory').value;closeSheet();mine()}}else if(n==='退出登录'){sheet('<h2>退出登录</h2><p>确认退出当前账号？</p><div class="actions"><button id="cancel">取消</button><button id="ok" class="primary">退出</button></div>');$('cancel').onclick=closeSheet;$('ok').onclick=()=>{closeSheet();screen('德清威德L4技改');$('main').innerHTML='<div class="profile"><div class="avatar">'+icon('user')+'</div><p>已退出登录</p></div>';$('main').append(btn('进入原型',()=>go('work'),'primary'))}}else{screen(n,()=>go('mine'));$('main').innerHTML=n==='个人资料'?'<section class="section">'+line('姓名',me)+line('所属水厂',factory)+'</section>':n==='关于'?'<section class="section"><h2>德清威德L4技改</h2></section>':'<section class="section"><label class="form-label">问题描述</label><textarea id="feedback" placeholder="请输入问题描述"></textarea><p class="error" id="error"></p><button class="primary" id="submitFeedback">提交</button></section>';if(n==='上报问题')$('submitFeedback').onclick=()=>{if(!$('feedback').value.trim()){$('error').textContent='请填写问题描述';return}toast('已记录问题');go('mine')}}}
function todo(){screen('德清威德L4技改',null,true);$('main').innerHTML='<div class="search"><input id="todoSearch" placeholder="搜索关键词" value="'+esc(todoKeyword)+'"><button id="todoFilter">筛选</button></div><div id="todoRows"></div>';$('todoSearch').oninput=e=>{todoKeyword=e.target.value;todoRows()};$('todoFilter').onclick=()=>{sheet('<h2>筛选</h2><label class="form-label">状态</label><select id="todoStatus"><option value="">全部</option><option>待接单</option><option>维修中</option></select><div class="actions"><button id="reset">重置</button><button class="primary" id="apply">确定</button></div>');$('todoStatus').value=todoState;$('reset').onclick=()=>$('todoStatus').value='';$('apply').onclick=()=>{todoState=$('todoStatus').value;closeSheet();todoRows()}};todoRows()}
function todoRows(){const show=(!todoState||todoState==='维修中')&&('WO2026111500008 粗格栅01 维修工单'.includes(todoKeyword));$('todoRows').innerHTML=show?'<article class="card" id="todoCard"><div class="todo-head"><strong>WO2026111500008</strong><span>维修工单</span></div><div class="card-body">'+line('发起时间','2026-11-15 15:51:35')+line('当前责任人','—')+line('备注','粗格栅01')+'<div class="card-top" style="margin:0">'+line('发起人',me)+'<span class="badge blue">维修中</span></div></div></article><div class="empty">已加载1条，没有更多记录了</div>':'<div class="empty">暂无数据</div>';if(show)$('todoCard').style.cursor='default'}
function reportList(){screen('设备报修',()=>go('work'));$('main').innerHTML='<div class="tabs"><button id="pending" class="'+(tab==='pending'?'active':'')+'">待处理</button><button id="history" class="'+(tab==='history'?'active':'')+'">历史记录</button></div><div class="search"><input id="reportSearch" placeholder="搜索关键词" value="'+esc(keyword)+'"></div><button class="primary" id="create">新增报修</button><div id="reportRows" style="margin-top:20px"></div>';$('pending').onclick=()=>{tab='pending';reportList()};$('history').onclick=()=>{tab='history';reportList()};$('reportSearch').oninput=e=>{keyword=e.target.value;reportRows()};$('create').onclick=()=>{draft={device:null,urgency:'',description:'',photos:[],reporter:me,time:''};create()};reportRows()}
function reportRows(){const data=reports.filter(r=>(tab==='pending'?r.status==='已报修':r.status==='已派单')&&[r.id,devices[r.device].code,devices[r.device].name,devices[r.device].location].join(' ').includes(keyword));$('reportRows').innerHTML=data.map(r=>{const d=devices[r.device];return '<article class="card" data-report="'+r.id+'"><div class="card-body"><div class="card-top"><strong class="number">'+r.id+'</strong><span class="badge">'+r.status+'</span></div>'+line('设备编码',d.code)+line('设备名称',d.name)+line('设备位置',d.location)+line('紧急程度',r.urgency)+line('报修时间',r.time)+line('报修人',r.reporter)+'</div></article>'}).join('')+'<div class="empty">'+(data.length?'已加载'+data.length+'条，没有更多记录了':'暂无数据')+'</div>';document.querySelectorAll('[data-report]').forEach(b=>{b.setAttribute('role','button');b.tabIndex=0;const open=()=>{const r=reports.find(r=>r.id===b.dataset.report);if(r.status==='已报修')dispatchReport(r);else detail(r)};b.onclick=open;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}

function create(){screen(draft.id?'修改报修':'创建报修',draft.id?()=>dispatchReport(reports.find(r=>r.id===draft.id)):reportList);const d=devices[draft.device];$('main').innerHTML='<button class="primary" id="pick">选择设备</button>'+(d?'<section class="section" style="margin-top:14px">'+line('设备编码',d.code)+line('设备名称',d.name)+line('设备类型',d.type)+line('设备位置',d.location)+line('设备位置路径',d.path||d.location)+'</section>':'')+'<section class="section" style="margin-top:16px"><h2>设备故障</h2><label class="form-label"><span class="req">*</span>紧急程度</label>'+radios(draft.urgency)+'<label class="form-label" for="description">故障描述</label><textarea id="description" placeholder="请输入故障描述">'+esc(draft.description)+'</textarea><label class="form-label">故障照片</label><input type="file" id="upload" accept="image/*" multiple hidden><button class="upload" id="uploadBtn" aria-label="上传故障照片">'+icon('camera')+'</button><div class="photos" id="draftPhotos"></div>'+line('报修人',me)+'<p class="error" id="error" role="alert"></p></section><button class="primary" id="save">保存</button>';$('pick').onclick=()=>{stash();picked=draft.device;deviceKeyword='';deviceType='';chooseLocation()};$('uploadBtn').onclick=()=>$('upload').click();$('upload').onchange=upload;paint('draftPhotos',draft.photos,true);$('save').onclick=save;dock('save')}
function stash(){draft.description=$('description').value.trim();draft.urgency=document.querySelector('[name=urgency]:checked')?.value||''}async function upload(e){for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>10*1024*1024){toast('单张照片不能超过10MB');continue}draft.photos.push(await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)}))}e.target.value='';paint('draftPhotos',draft.photos,true)}
function paint(id,photos,editable=false){const root=$(id);root.replaceChildren();photos.forEach((src,i)=>{const div=document.createElement('div'),img=document.createElement('img');img.src=src;img.alt='故障照片'+(i+1);img.onclick=()=>{sheet('<h2>照片预览</h2><img id="large" style="width:100%;max-height:60vh;object-fit:contain"><div class="actions"><button id="closePhoto">关闭</button></div>');$('large').src=src;$('closePhoto').onclick=closeSheet};div.append(img);if(editable)div.append(btn('移除',()=>{photos.splice(i,1);paint(id,photos,true)}));root.append(div)})}
function save(){stash();if(draft.device===null){$('error').textContent='请选择设备';return}if(!draft.urgency){$('error').textContent='请选择紧急程度';return}if(draft.id){const r=reports.find(r=>r.id===draft.id);if(!r||r.status!=='已报修')return;Object.assign(r,{device:draft.device,urgency:draft.urgency,description:draft.description,photos:[...draft.photos]});draft=null;dispatchReport(r);toast('修改成功');return}draft.time=now();reports.unshift({...draft,id:'TB'+draft.time.replace(/\D/g,''),status:'已报修',source:'人工提报',handler:'',outsourced:'否',remark:''});draft=null;tab='pending';keyword='';reportList();toast('报修提交成功')}
let repairTab='pending',repairKeyword='',repairStatus='',repairPhotos=[];const repairs=[{id:'WO2026111500009',device:1,status:'待接单',urgency:'急',time:'2026-11-15 16:20:36',reporter:'张贵测试',handler:'张贵测试',description:'123',photos:[],acceptedAt:'',level:'',faultType:'',content:''},{id:'WO2026111500008',device:0,status:'维修中',urgency:'特急',time:'2026-11-15 15:51:35',reporter:'张贵测试',handler:'张贵测试',description:'12312',photos:[],acceptedAt:'2026-11-15 15:52:07',level:'',faultType:'',content:''},{id:'WO2026111400007',device:2,status:'已完成',urgency:'一般',time:'2026-11-14 14:20:00',reporter:'张贵测试',handler:'张贵测试',description:'设备运行异常，请检查。',photos:[],acceptedAt:'2026-11-14 14:35:00',level:'小修',faultType:'机械故障',content:'已完成现场检查与处理。'}];
function repairList(){screen('设备维修工单',()=>go('work'));const statusOptions=['全部','待接单','维修中','已完成'];$('main').innerHTML='<div class="tabs"><button id="repairPending" class="'+(repairTab==='pending'?'active':'')+'">待处理</button><button id="repairHistory" class="'+(repairTab==='history'?'active':'')+'">历史记录</button></div><div class="search"><input id="repairSearch" placeholder="搜索关键词" value="'+esc(repairKeyword)+'"><select id="repairStatus" aria-label="工单状态" style="width:110px">'+statusOptions.map(s=>'<option value="'+(s==='全部'?'':s)+'">'+(s==='全部'?'请选择':s)+'</option>').join('')+'</select></div><div id="repairRows"></div>';$('repairStatus').value=repairStatus;$('repairPending').onclick=()=>{repairTab='pending';repairList()};$('repairHistory').onclick=()=>{repairTab='history';repairList()};$('repairSearch').oninput=e=>{repairKeyword=e.target.value;repairRows()};$('repairStatus').onchange=e=>{repairStatus=e.target.value;repairRows()};repairRows()}
function repairRows(){const rows=repairs.filter(r=>(repairTab==='pending'?r.status!=='已完成':r.status==='已完成')&&(!repairStatus||r.status===repairStatus)&&[r.id,devices[r.device].name,devices[r.device].location,r.handler].join(' ').includes(repairKeyword));$('repairRows').innerHTML=rows.map(r=>{const d=devices[r.device],cls=r.status==='待接单'?'red':r.status==='维修中'?'blue':'';return '<article class="card" data-repair="'+r.id+'"><div class="card-body"><div class="card-top"><strong class="number">'+r.id+'</strong><span class="badge '+cls+'">'+r.status+'</span></div>'+line('设备名称',d.name)+line('设备位置路径',d.location)+line('紧急程度',r.urgency)+line('报修时间',r.time)+line('报修人',r.reporter)+line('维修责任人',r.handler)+'</div></article>'}).join('')+'<div class="empty">'+(rows.length?'已加载'+rows.length+'条，没有更多记录了':'暂无数据')+'</div>';document.querySelectorAll('[data-repair]').forEach(node=>{const open=()=>repairDetail(repairs.find(r=>r.id===node.dataset.repair));node.setAttribute('role','button');node.tabIndex=0;node.onclick=open;node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function repairDetail(r){if(!r)return;screen('维修工单详情',repairList);const d=devices[r.device],canEdit=r.status==='维修中';$('main').innerHTML='<section class="section"><h2>报修信息</h2>'+line('设备编码',d.code)+line('设备名称',d.name)+line('设备类型',d.type)+line('设备位置',d.location)+line('设备位置路径',d.location)+line('紧急程度',r.urgency)+ '<label class="form-label">故障描述</label><textarea readonly>'+esc(r.description)+'</textarea><label class="form-label">故障照片</label><div class="photos" id="faultPhotos"></div></section>'+(r.status==='待接单'?'': '<section class="section"><h2>维修信息</h2>'+line('接单时间',r.acceptedAt)+line('接单人',r.handler)+(canEdit?'<label class="form-label"><span class="req">*</span>维修级别</label><select id="repairLevel"><option value="">请选择</option><option>大修</option><option>中修</option><option>小修</option></select><label class="form-label"><span class="req">*</span>故障类型</label><select id="repairFaultType"><option value="">请选择</option><option>电器故障</option><option>机械故障</option></select><label class="form-label"><span class="req">*</span>维修内容</label><textarea id="repairContent" placeholder="请输入">'+esc(r.content)+'</textarea><label class="form-label"><span class="req">*</span>维修照片</label><input type="file" id="repairUpload" accept="image/*" multiple hidden><button class="upload" id="repairUploadBtn" aria-label="上传维修照片">'+icon('camera')+'</button><div class="photos" id="repairPhotoList"></div><p class="error" id="repairError" role="alert"></p>':line('维修级别',r.level)+line('故障类型',r.faultType)+line('维修内容',r.content)+'<label class="form-label">维修照片</label><div class="photos" id="repairPhotoList"></div>')+'</section>');paint('faultPhotos',r.photos);if(!r.photos.length)$('faultPhotos').textContent='暂无照片';if(r.status==='待接单'){const accept=btn('接单',()=>repairAccept(r),'primary');dockNode(accept)}else if(canEdit){repairPhotos=[];$('repairLevel').value=r.level;$('repairFaultType').value=r.faultType;$('repairUploadBtn').onclick=()=>$('repairUpload').click();$('repairUpload').onchange=repairUpload;paint('repairPhotoList',repairPhotos,true);const saveBtn=btn('提交',()=>repairSave(r),'primary');dockNode(saveBtn)}else{paint('repairPhotoList',r.repairPhotos||[]);if(!(r.repairPhotos||[]).length)$('repairPhotoList').textContent='暂无照片'}}
const baseRepairDetail=repairDetail;repairDetail=function(r){baseRepairDetail(r);const faultPhotos=$('faultPhotos');if(faultPhotos)faultPhotos.insertAdjacentHTML('afterend',line('报修人',r.reporter)+line('报修时间',r.time));if(r.status==='维修中'){const labels=[...$('main').querySelectorAll('.form-label')],faultLabel=labels.find(node=>node.textContent==='故障描述'),faultPhotoLabel=labels.find(node=>node.textContent==='故障照片'),faultDescription=$('main').querySelector('textarea[readonly]');if(faultLabel)faultLabel.innerHTML='<span class="req">*</span>故障描述';if(faultPhotoLabel)faultPhotoLabel.innerHTML='<span class="req">*</span>故障照片';if(faultDescription){faultDescription.removeAttribute('readonly');faultDescription.id='faultDescription'}if(faultPhotos){faultPhotos.insertAdjacentHTML('beforebegin','<input type="file" id="faultUpload" accept="image/*" multiple hidden><button class="upload" id="faultUploadBtn" aria-label="上传故障照片">'+icon('camera')+'</button>');paint('faultPhotos',r.photos,true);$('faultUploadBtn').onclick=()=>$('faultUpload').click();$('faultUpload').onchange=e=>repairFaultUpload(e,r)}}const sections=$('main').querySelectorAll(':scope > .section');if(r.status!=='待接单'&&sections.length>1)$('main').insertBefore(sections[1],sections[0])}
async function repairFaultUpload(e,r){for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>10*1024*1024){toast('单张照片不能超过10MB');continue}r.photos.push(await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(f)}))}e.target.value='';paint('faultPhotos',r.photos,true)}
function dockNode(node){const bar=$('actionBar');bar.style.display='';bar.style.gap='';bar.replaceChildren(node);bar.hidden=false}
function repairAccept(r){if(r.status!=='待接单')return;r.status='维修中';r.acceptedAt=now();repairDetail(r);toast('接单成功')}
async function repairUpload(e){for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>10*1024*1024){toast('单张照片不能超过10MB');continue}repairPhotos.push(await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(f)}))}e.target.value='';paint('repairPhotoList',repairPhotos,true)}
function repairSave(r){const level=$('repairLevel').value,faultType=$('repairFaultType').value,content=$('repairContent').value.trim(),faultDescription=$('faultDescription')?.value.trim()||'';if(!faultDescription||!r.photos.length||!level||!faultType||!content||!repairPhotos.length){$('repairError').textContent='请完整填写故障描述、上传故障照片、维修级别、故障类型、维修内容并上传维修照片';return}Object.assign(r,{status:'已完成',description:faultDescription,level,faultType,content,repairPhotos:[...repairPhotos]});repairTab='history';repairKeyword='';repairStatus='';repairList();toast('维修提交成功')}
function ledger(){deviceKeyword='';deviceType='';chooseDevice(false)}function chooseDevice(selecting,location=''){selectedLocation=location;screen(selecting?'选择设备':'设备台账',selecting?chooseLocation:()=>go('work'));$('main').innerHTML='<div class="search"><input id="deviceSearch" placeholder="搜索关键词" value="'+esc(deviceKeyword)+'"><select id="deviceType" aria-label="设备状态" style="width:110px"><option value="">请选择</option><option>在用</option><option>保养</option><option>故障</option></select></div><div id="deviceRows"></div>'+(selecting?'<div class="sticky-action"><button class="primary" id="confirmDevice">确认</button></div>':'');$('deviceType').value=deviceType;$('deviceSearch').oninput=e=>{deviceKeyword=e.target.value;if(selecting)dock('confirmDevice');deviceRows(selecting)};$('deviceType').onchange=e=>{deviceType=e.target.value;deviceRows(selecting)};if(selecting)$('confirmDevice').onclick=()=>{if(picked===null)return toast('请选择设备');draft.device=picked;create()};deviceRows(selecting)}
function deviceRows(selecting){$('deviceRows').innerHTML=devices.map((d,i)=>({d,i})).filter(({d})=>(!selecting||d.location===selectedLocation)&&(!deviceType||d.status===deviceType)&&[d.code,d.name,d.location].join(' ').includes(deviceKeyword)).map(({d,i})=>'<button class="device '+(selecting&&picked===i?'selected':'')+'" data-device="'+i+'">'+line('设备编码',d.code)+line('设备名称',d.name)+line('设备位置',d.location)+'<div class="card-top" style="margin:0">'+line('设备类型',d.type)+'<span class="badge '+(d.status==='故障'?'red':'')+'">'+d.status+'</span></div></button>').join('')||'<div class="empty">暂无数据</div>';document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{if(selecting){picked=+b.dataset.device;deviceRows(true)}else{const d=devices[+b.dataset.device];screen('设备详情',ledger);$('main').innerHTML='<section class="section"><h2>设备信息</h2>'+line('设备编码',d.code)+line('设备名称',d.name)+line('设备位置',d.location)+line('设备位置路径',d.location)+line('设备类型',d.type)+line('状态',d.status)+'</section>'}})}
function detail(r){screen('报修单详情',reportList);const d=devices[r.device];$('main').innerHTML='<section class="section"><div class="detail-title"><h2>设备信息</h2><span class="badge">'+r.status+'</span></div>'+line('设备编码',d.code)+line('设备名称',d.name)+line('设备类型',d.type)+line('设备位置',d.location)+line('设备位置路径',d.location)+'</section><section class="section"><h2>设备故障</h2><label class="form-label">紧急程度</label>'+radios(r.urgency,true)+'<label class="form-label">故障描述</label><textarea readonly>'+esc(r.description||'')+'</textarea><label class="form-label">故障照片</label><div class="photos" id="detailPhotos"></div>'+line('报修人',r.reporter)+line('报修时间',r.time)+line('来源',r.source)+line('来源单据',r.sourceNo)+'</section>'+(r.status==='已派单'?'<section class="section"><h2>派单信息</h2>'+line('处理人',r.handler)+line('派单时间',r.dispatchTime)+line('是否委外',r.outsourced)+line('备注',r.remark)+'</section>':'');paint('detailPhotos',r.photos);if(!r.photos.length)$('detailPhotos').textContent='暂无照片'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeSheet()});$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});

function dispatchSheet(r){sheet('<h2>派单信息</h2><label class="form-label" for="dispatchHandler"><span class="req">*</span>处理人</label><select id="dispatchHandler"><option value="">请选择</option><option>柳博</option><option>李阳洋</option><option>吴叶波</option></select><label class="form-label" for="dispatchOutsourced"><span class="req">*</span>是否委外</label><select id="dispatchOutsourced"><option>否</option><option>是</option></select><label class="form-label" for="dispatchRemark">备注</label><textarea id="dispatchRemark" placeholder="请输入备注"></textarea><p class="error" id="dispatchError" role="alert"></p><div class="actions"><button id="cancelDispatch">取消</button><button class="primary" id="confirmDispatch">确认派单</button></div>');$('cancelDispatch').onclick=closeSheet;$('confirmDispatch').onclick=()=>{const handler=$('dispatchHandler').value;if(!handler){$('dispatchError').textContent='请选择处理人';$('dispatchHandler').focus();return}if(r.status!=='已报修')return;Object.assign(r,{handler,outsourced:$('dispatchOutsourced').value,remark:$('dispatchRemark').value.trim(),dispatchTime:now(),status:'已派单'});closeSheet();tab='history';reportList();toast('派单成功')}}
